<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
      <ion-back-button [defaultHref]="dashboardUrl()"></ion-back-button>
    </ion-buttons>
    <ion-title>Past Workouts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="workouts === null" class="flex justify-center mt-10">
    <ion-spinner></ion-spinner>
  </div>

  <ion-list lines="none" class="bg-transparent">
    <app-workout-list-item
      *ngFor="let workout of workouts"
      [workout]="workout"
      (deleted)="onWorkoutDeleted($event)"
    ></app-workout-list-item>
  </ion-list>

  <div
    *ngIf="workouts?.length === 0"
    class="text-center text-muted mt-10"
  >
    <p>No workouts recorded yet.</p>
  </div>
</ion-content>
