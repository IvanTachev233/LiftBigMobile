<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Dashboard </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dashboard</ion-title>
    </ion-toolbar>
  </ion-header>

  <h2 class="section-title">Upcoming Workouts</h2>

  <!-- Loading State (Simple) -->
  <div *ngIf="upcomingWorkouts === null" class="flex justify-center mt-10">
    <ion-spinner></ion-spinner>
  </div>

  <ion-list lines="none" class="bg-transparent">
    <app-workout-list-item
      *ngFor="let workout of upcomingWorkouts"
      [workout]="workout"
      (deleted)="onWorkoutDeleted($event)"
    ></app-workout-list-item>
  </ion-list>

  <div
    *ngIf="upcomingWorkouts?.length === 0"
    class="text-center text-muted mt-10"
  >
    <p>No upcoming workouts planned.</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/workout-logger">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
