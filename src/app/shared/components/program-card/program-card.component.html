<ion-card class="program-card" [routerLink]="routerLink">
  <ion-card-header>
    <div class="card-header-row">
      <ion-card-title class="card-title">{{ program.name }}</ion-card-title>
      <div class="card-header-actions">
        <ion-badge color="primary">{{ exerciseCount }} exercises</ion-badge>
        <ion-button
          *ngIf="showDelete"
          color="danger"
          fill="clear"
          size="small"
          class="card-delete-btn"
          (click)="onRemove($event)"
        >
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
    <ion-card-subtitle class="card-subtitle">{{
      program.scheduledDate | date : 'mediumDate'
    }}</ion-card-subtitle>
  </ion-card-header>
  <ion-card-content>
    <div *ngFor="let ex of exerciseSummaries.slice(0, 3)" class="exercise-preview">
      <span>{{ ex.name }}</span>
      <span class="font-mono">{{ ex.setCount }}x{{ ex.reps }}
        <span *ngIf="ex.weight">@ {{ ex.weight }}kg</span>
      </span>
    </div>
    <div *ngIf="exerciseCount > 3" class="more-exercises">
      +{{ exerciseCount - 3 }} more
    </div>
  </ion-card-content>
</ion-card>
