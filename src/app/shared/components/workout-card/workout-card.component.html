<ion-card
  class="workout-card"
  [routerLink]="['/workout-logger']"
  [queryParams]="{ id: workout.id }"
>
  <ion-card-header>
    <div class="card-header-row">
      <ion-card-title class="card-title">
        {{ workout.name }}
        @if (workout.hasPb) {
          <span class="pb-trophy" role="img" aria-label="Has a personal best">
            <ion-icon name="trophy" color="warning" aria-hidden="true"></ion-icon>
          </span>
        }
      </ion-card-title>
      <ion-badge [color]="getBadgeColor(workout.status)">{{
        workout.status
      }}</ion-badge>
    </div>
    <ion-card-subtitle class="card-subtitle">{{
      workout.date | date : 'mediumDate'
    }}</ion-card-subtitle>
    <span
      *ngIf="badge"
      class="source-badge"
      [class.coach-badge]="source === 'coach'"
      [class.program-badge]="source === 'program'"
      >{{ badge }}</span
    >
  </ion-card-header>
  <ion-card-content>
    <div class="card-volume-row">
      <span>Volume</span>
      <span class="font-mono">{{ workout.totalWeightLifted | weight }}</span>
    </div>
  </ion-card-content>
</ion-card>
