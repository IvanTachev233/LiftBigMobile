<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button class="btn-text muted close-btn" (click)="close()">Close</ion-button>
    </ion-buttons>
    <ion-title>{{ exerciseName }}</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" class="add-entry-btn" aria-label="Add entry" (click)="addEntry()">
        <ion-icon slot="icon-only" name="add" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="history-modal-content">
  <app-exercise-history [exerciseId]="exerciseId" />
</ion-content>
